port = "graphics/libwebp"
only_for_targets = ["emulate/emscripten"]
depends = ["graphics/png", "graphics/jpeg", "graphics/giflib", "graphics/tiff"]
build_style = "cmake"
separate_build = true

cmake_args = [
    "-DWEBP_BUILD_VWEBP=OFF",
    "-DWEBP_ENABLE_SIMD=OFF",
    "-DWEBP_BUILD_LIBWEBPMUX=ON",
    "-DWEBP_BUILD_CWEBP=ON",
    "-DWEBP_BUILD_DWEBP=ON",
    "-DWEBP_BUILD_GIF2WEBP=OFF",
    "-DWEBP_BUILD_IMG2WEBP=OFF",
    "-DWEBP_BUILD_WEBPINFO=OFF",
    "-DWEBP_BUILD_WEBPMUX=OFF",
    "-DWEBP_BUILD_EXTRAS=OFF",
]

[[applets]]
sym = "cwebp"
binary = "/usr/local/bin/cwebp"
paths = ["/usr/local/bin/cwebp"]

[[applets]]
sym = "dwebp"
binary = "/usr/local/bin/dwebp"
paths = ["/usr/local/bin/dwebp"]
