port = "sysutils/xxhash"
build_style = "make"
use_gmake = true

cppflags = [
    "-DXXH_VECTOR=0",
    "-DXXH_FORCE_MEMORY_ACCESS=0",
]

build_cmd = [
    "gmake -j\"$JOBS\" libxxhash.a xxhsum libxxhash.pc DISPATCH=0 XXH_FORCE_MEMORY_ACCESS=0 PREFIX=/usr/local",
]

install_cmd = [
    "gmake install_libxxhash.a install_libxxhash.includes install_libxxhash.pc install_xxhsum install_man DISPATCH=0 DESTDIR=\"$STAGE_DIR\" PREFIX=/usr/local MANDIR=/usr/local/man/man1 PKGCONFIGDIR=/usr/local/lib/pkgconfig",
]

[[applets]]
sym = "xxhsum"
binary = "/usr/local/bin/xxhsum"
paths = [
    "/usr/local/bin/xxhsum",
    "/usr/local/bin/xxh32sum",
    "/usr/local/bin/xxh64sum",
    "/usr/local/bin/xxh128sum",
]
discover_symlink_aliases_in = ["/usr/local/bin"]
