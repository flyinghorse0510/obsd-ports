port = "textproc/lowdown"
build_style = "simple"
configure_host = false
configure_default_args = false
use_gmake = true

pre_configure = [
    "sed -i.bak -E -e 's/^\\.ifdef /ifdef /' -e 's/^\\.if \\$\\(([A-Za-z0-9_]+)\\) == \"([^\"]*)\"/ifeq ($(\\1),\\2)/' -e 's/^\\.else$/else/' -e 's/^\\.endif$/endif/' Makefile && rm -f Makefile.bak",
]

configure_args = [
    "PREFIX=/usr/local",
    "MANDIR=/usr/local/man",
]

make_targets = [
    "bins",
    "liblowdown.a",
    "lowdown.pc",
]

install_cmd = [
    "gmake install install_static DESTDIR=\"$STAGE_DIR\"",
]

[[applets]]
sym = "lowdown"
binary = "/usr/local/bin/lowdown"
paths = [
    "/usr/local/bin/lowdown",
    "/usr/local/bin/lowdown-diff",
]
