port = "archivers/p7zip"
depends = ["converters/libiconv"]
build_style = "make"
use_gmake = true

pre_build = [
    "cp -f \"$WRKSRC/makefile.openbsd\" \"$WRKSRC/makefile.machine\"",
]

build_cmd = [
    "gmake -f makefile -j\"$JOBS\" 7za 7zr MYCC=\"$CC\" MYCXX=\"$CXX\" MYCFLAGS=\"$CFLAGS -I$STAGE_DIR/usr/local/include\" MYCXXFLAGS=\"$CXXFLAGS -I$STAGE_DIR/usr/local/include\" LDFLAGS=\"$LDFLAGS\" LOCAL_LIBS=\"-L$STAGE_DIR/usr/local/lib -liconv -lpthread\"",
]

install_cmd = [
    "obsd-install -d -m 0755 \"$STAGE_DIR/usr/local/bin\" \"$STAGE_DIR/usr/local/man/man1\"",
    "obsd-install -c -m 0755 bin/7za bin/7zr \"$STAGE_DIR/usr/local/bin/\"",
    "ln -sf 7za \"$STAGE_DIR/usr/local/bin/7z\"",
    "obsd-install -c -m 0444 man1/7z.1 man1/7za.1 man1/7zr.1 \"$STAGE_DIR/usr/local/man/man1/\"",
]

[[applets]]
sym = "p7zip_7za"
binary = "/usr/local/bin/7za"
paths = [
    "/usr/local/bin/7za",
    "/usr/local/bin/7z",
]

[[applets]]
sym = "p7zip_7zr"
binary = "/usr/local/bin/7zr"
paths = ["/usr/local/bin/7zr"]

[versions."8.0"]
vendor_port = "archivers/7zip"
pkgname = "7zip-26.03"
extract_only = ["7z2603-src.tar.xz"]
fix_crlf_files = [
    "CPP/7zip/7zip_gcc.mak",
    "CPP/7zip/Bundles/SFXCon/SfxCon.cpp",
    "CPP/7zip/Compress/DllExportsCompress.cpp",
    "CPP/7zip/UI/Common/ArchiveCommandLine.cpp",
    "CPP/7zip/UI/Console/Main.cpp",
    "CPP/7zip/UI/Console/UserInputUtils.cpp",
    "CPP/Windows/System.cpp",
]
pre_build = []
build_cmd = [
    "gmake -C \"$WRKSRC/CPP/7zip/Bundles/Alone\" -f ../../cmpl_clang.mak -j\"$JOBS\" CC=\"$CC\" CXX=\"$CXX\" LOCAL_CFLAGS=\"$CFLAGS\" LOCAL_CXXFLAGS=\"$CXXFLAGS\"",
    "gmake -C \"$WRKSRC/CPP/7zip/Bundles/Alone7z\" -f ../../cmpl_clang.mak -j\"$JOBS\" CC=\"$CC\" CXX=\"$CXX\" LOCAL_CFLAGS=\"$CFLAGS\" LOCAL_CXXFLAGS=\"$CXXFLAGS\"",
]
install_cmd = [
    "obsd-install -d -m 0755 \"$STAGE_DIR/usr/local/bin\" \"$STAGE_DIR/usr/local/man/man1\"",
    "obsd-install -c -m 0755 \"$WRKSRC\"/CPP/7zip/Bundles/Alone/b/*/7za \"$WRKSRC\"/CPP/7zip/Bundles/Alone7z/b/*/7zr \"$STAGE_DIR/usr/local/bin/\"",
    "ln -sf 7za \"$STAGE_DIR/usr/local/bin/7z\"",
    "sed 's,\\${TRUEPREFIX},/usr/local,g' \"$VENDOR_PORT_DIR/files/7z.1\" > \"$STAGE_DIR/usr/local/man/man1/7z.1\"",
    "chmod 0444 \"$STAGE_DIR/usr/local/man/man1/7z.1\"",
    "ln -sf 7z.1 \"$STAGE_DIR/usr/local/man/man1/7za.1\"",
    "ln -sf 7z.1 \"$STAGE_DIR/usr/local/man/man1/7zr.1\"",
]
