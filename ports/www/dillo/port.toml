port = "www/dillo"
only_for_targets = ["emulate/emscripten"]
depends = ["converters/libiconv", "archivers/brotli", "graphics/jpeg", "graphics/png", "graphics/libwebp", "x11/fltk"]
build_style = "gnu"
use_gmake = true

pre_configure = [
    "if [ ! -f \"$WRKSRC/configure\" ]; then autoreconf -fi; fi",
]

cppflags = [
    "-I/usr/X11R6/include",
    "-I/usr/X11R6/include/freetype2",
]

ldflags = [
    "-L/usr/X11R6/lib",
]

libs = [
    "-lbrotlicommon",
    "-lssl",
    "-lcrypto",
    "-liconv",
    "-lz",
]

configure_args = [
    "--sysconfdir=/usr/local/etc",
    "--enable-tls",
    "--enable-ipv6",
    "--enable-webp",
    "--enable-png",
    "--enable-jpeg",
    "--enable-gif",
    "--x-includes=/usr/X11R6/include",
    "--x-libraries=/usr/X11R6/lib",
]

post_install = [
    "install -d -m 0755 \"$STAGE_DIR/usr/local/etc/dillo\" \"$STAGE_DIR/usr/local/share/pixmaps\"",
    "if [ -f \"$WRKSRC/dpid/dpidrc\" ] && [ ! -f \"$STAGE_DIR/usr/local/etc/dillo/dpidrc\" ]; then install -c -m 0644 \"$WRKSRC/dpid/dpidrc\" \"$STAGE_DIR/usr/local/etc/dillo/dpidrc\"; fi",
    "if [ -f \"$WRKSRC/dillorc\" ] && [ ! -f \"$STAGE_DIR/usr/local/etc/dillo/dillorc\" ]; then install -c -m 0644 \"$WRKSRC/dillorc\" \"$STAGE_DIR/usr/local/etc/dillo/dillorc\"; fi",
    "if [ -f \"$VENDOR_PORT_DIR/files/dillo.xpm\" ]; then install -c -m 0644 \"$VENDOR_PORT_DIR/files/dillo.xpm\" \"$STAGE_DIR/usr/local/share/pixmaps/dillo.xpm\"; fi",
]

[versions."8.0"]
applets_append = [
    { sym = "dilloc", binary = "/usr/local/bin/dilloc", paths = ["/usr/local/bin/dilloc"] },
]

[[applets]]
sym = "dillo"
binary = "/usr/local/bin/dillo"
paths = ["/usr/local/bin/dillo"]

