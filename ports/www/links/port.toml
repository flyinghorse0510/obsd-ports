port = "www/links"
build_style = "gnu"
use_gmake = true

cflags = [
    "-std=gnu89",
    "-Wno-implicit-int",
    "-Wno-implicit-function-declaration",
    "-Wno-deprecated-non-prototype",
]

pre_configure = [
    "for d in /usr/share/misc /usr/share/automake-* /opt/homebrew/share/automake-* /usr/local/share/automake-*; do if [ -f \"$d/config.sub\" ] && [ -f \"$d/config.guess\" ]; then cp -f \"$d/config.sub\" \"$d/config.guess\" \"$WRKSRC/\" && exit 0; fi; done; echo 'www/links: missing config.sub/config.guess (install automake)' >&2; exit 1",
]

configure_args = [
    "--with-ssl",
    "--without-x",
    "--without-svgalib",
    "--without-fb",
    "--without-directfb",
    "--without-pmshell",
    "--without-atheos",
]

[env]
ac_cv_rename_over_existing_files = "yes"

[[applets]]
sym = "links"
binary = "/usr/local/bin/links"
paths = ["/usr/local/bin/links"]
